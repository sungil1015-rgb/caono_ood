[experiment]
output_dir = 'data/experiment_v1/roi_resnet18_full_supcon/c003_masked_mean_max'
seed = 1047
product = '3029C003AA'

[data]
input_size = 1024
mask_border_pixels = 8
image_mean = [0.485, 0.456, 0.406]
image_std = [0.229, 0.224, 0.225]

[augmentation]
rotation_degrees = [0]
color_jitter_probability = 0.85
brightness = 0.15
contrast = 0.15
saturation = 0.08

[model]
backbone = 'resnet18'
pooling = 'masked_mean_max'
pretrained = true
projection_hidden_dim = 256
embedding_dim = 128

[train]
epochs = 10
save_epochs = [7]
serials_per_step = 12
microbatch = 6
workers = 4
backbone_learning_rate = 0.00001
head_learning_rate = 0.0003
weight_decay = 0.0001
grad_clip_norm = 2.0
scheduler = 'cosine'
early_stop_min_epochs = 5
early_stop_patience = 2
early_stop_min_delta = 0.001

[loss]
temperature = 0.1

[evaluation]
batch_size = 16
workers = 4
neighbors = 5
normal_quantile = 0.99
