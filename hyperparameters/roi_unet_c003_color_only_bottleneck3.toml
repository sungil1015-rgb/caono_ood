[experiment]
output_dir = 'data/experiment_v1/roi_unet_contrastive/color_only_bottleneck3_batch144_epoch20'
seed = 1047

[augmentation]
rotation_degrees = [0]
color_jitter_probability = 0.85
brightness = 0.15
contrast = 0.15
saturation = 0.08

[data]
input_size = 1024
mask_border_pixels = 8
image_mean = [0.485, 0.456, 0.406]
image_std = [0.229, 0.224, 0.225]

[model]
bottleneck_channels = 128
up2_channels = 96
up1_channels = 64
group_norm_groups = 8
projection_hidden_dim = 256
embedding_dim = 128

[train]
epochs = 20
serials_per_step = 12
microbatch = 6
workers = 4
learning_rate = 0.0003
weight_decay = 0.0001
grad_clip_norm = 2.0
scheduler = 'cosine'

[loss]
temperature = 0.1
bottleneck_weight = 3.0
up2_weight = 1.0
up1_weight = 1.0

[evaluation]
batch_size = 16
workers = 4
feature_chunk_size = 8
neighbors = 5
normal_quantile = 0.99
